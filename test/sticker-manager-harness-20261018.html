<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticker Manager test page</title>
<!--
  Discord Damsel's Sticker Manager outside Discord: the real plugin file, a pretend BetterDiscord (BdApi) and pretend
  servers and stickers, drawn as coloured squares. Nothing here talks to Discord. Open it over http
  (for example `python -m http.server` in the repo root, then /test/sticker-manager-harness-20261018.html).
  Add ?zero for an account with 0 favorites (like Astra's before the first test inside Discord, 2026-10-19), ?empty
  for a Discord that has no favorites list yet, ?broken for a Discord the plugin cannot find.
  The confirmation draws its content the way BetterDiscord 1.14.3 does: a string becomes inline text with nothing
  between it and the next one; an element is drawn as it is.
  Claude Opus 5.5 (claude-opus-5-5), 2026-10-18; ?zero and the BetterDiscord-style confirmation 2026-10-19.
-->
<style>
  :root { color-scheme: dark; --background-secondary: #2b2d31; --background-tertiary: #1e1f22; --text-normal: #dbdee1; --text-muted: #949ba4; }
  body { margin: 0; background: #111214; color: #dbdee1; font: 14px/1.45 system-ui, sans-serif; }
  .modal { max-width: 700px; margin: 24px auto; background: #313338; border-radius: 10px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; }
  .modal h1 { font-size: 18px; margin: 0; padding: 16px 16px 8px; }
  .modal .scroll { overflow: auto; padding: 0 16px 16px; }
  .harness-log { max-width: 700px; margin: 0 auto 24px; font: 12px ui-monospace, monospace; color: #949ba4; white-space: pre-wrap; padding: 0 16px; }
  .confirm-back { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 10; }
  .confirm { background: #313338; border-radius: 8px; width: min(440px, calc(100vw - 32px)); padding: 16px; }
  .confirm h2 { margin: 0 0 8px; font-size: 18px; }
  .confirm .content { font-size: 16px; line-height: 20px; } /* BetterDiscord's .bd-modal-content */
  .confirm .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .confirm button { font: inherit; border: 0; border-radius: 4px; padding: 7px 14px; cursor: pointer; }
  .confirm .ok { background: #5865f2; color: white; }
  .confirm .ok.danger { background: #da373c; }
  .confirm .no { background: transparent; color: #dbdee1; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #23a55a; color: white; padding: 8px 14px; border-radius: 6px; z-index: 11; }
  .toast.error { background: #da373c; }
</style>
</head>
<body>
<div class="modal" role="dialog" aria-label="DiscordDamselStickerManager settings">
  <h1>DiscordDamselStickerManager Settings</h1>
  <div class="scroll" id="panel"></div>
</div>
<div class="harness-log" id="log" aria-label="What the plugin asked Discord to do"></div>
<script>var module = { exports: {} };</script>
<script src="../discord-tower/sticker-manager/discord-damsel-sticker-manager-20261018.plugin.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const log = (line) => { document.getElementById('log').textContent += line + '\n'; };
  const colors = ['#ff6b9a', '#7ae1bf', '#ffd166', '#8ec5ff', '#c89bff', '#ffa45b', '#9be15d', '#ff8fd8'];
  const names = ['wave', 'blush', 'yay', 'sleepy', 'mad', 'heart', 'cry', 'lol', 'wink', 'sip', 'dance', 'shrug', 'peek', 'hug', 'boop', 'nod'];
  const serverDefs = [
    ['Press Plai', 14, true], ['Astra\'s Farm', 9, true], ['VRChat Pole Club', 23, true], ['Unity Unicorns', 0, true],
    ['Lofi Corner', 6, false], ['Big Server Not Loaded', null, true], ['Mommy\'s Mommies', 4, true], ['<b>Tag test</b> & friends', 2, true],
  ];
  let next = 1000;
  const guilds = {}, stickersByGuild = new Map(), order = [];
  serverDefs.forEach(([name, count, icon], g) => {
    const id = String(100 + g);
    guilds[id] = { id, name, icon: icon ? 'f'.repeat(31) + g : null };
    order.push(id);
    if (count === null) return;
    stickersByGuild.set(id, Array.from({ length: count }, (_, i) => ({
      id: String(next++), name: names[i % names.length] + (i >= names.length ? i : ''), tags: ['happy', 'sad', 'love'][i % 3],
      format_type: i === 2 ? 4 : 1, available: !(g === 2 && i === 5), guild_id: id, color: colors[(g + i) % colors.length],
    })));
  });
  const byId = new Map([...stickersByGuild.values()].flat().map((s) => [s.id, s]));
  const value = params.has('empty') ? {} : { favoriteStickers: { stickerIds: params.has('zero') ? [] : ['1000', '1003', '9999'] } };
  const frecency = {
    ProtoClass: { typeName: 'discord_protos.discord_users.v1.FrecencyUserSettings' },
    getCurrentValue: () => value,
    async updateAsync(field, updater, delay) {
      const copy = value[field] ? { stickerIds: [...value[field].stickerIds] } : undefined;
      if (updater(copy) === false) { log('updateAsync(' + field + '): cancelled (nothing handed over)'); return; }
      value[field] = copy;
      log('updateAsync(' + field + ', delay ' + delay + ') -> ' + JSON.stringify(copy.stickerIds));
    },
  };
  const stores = {
    GuildStore: { getGuilds: () => guilds },
    SortedGuildStore: { getFlattenedGuildIds: () => order },
    StickersStore: { getStickersByGuildId: (id) => stickersByGuild.get(id), getStickerById: (id) => byId.get(id) },
  };
  const modules = params.has('broken') ? [] : [{ INFREQUENT_USER_ACTION: 0 }, frecency];
  const data = {};
  // A pretend React: elements as plain objects, as React makes them, drawn below with textContent only.
  const React = { createElement: (type, props, ...children) => ({ type, props: { ...props, children: children.length === 1 ? children[0] : children } }) };
  const draw = (node) => {
    // BetterDiscord 1.14.3 (src/betterdiscord/ui/modals.ts) turns a string into Discord's inline markdown: inline text.
    if (typeof node === 'string' || typeof node === 'number') { const span = document.createElement('span'); span.textContent = node; return span; }
    const tag = /^(div|p|span|strong|em)$/.test(node?.type) ? node.type : 'span';
    const out = document.createElement(tag);
    if (node?.props?.className) out.className = node.props.className;
    if (node?.props?.style?.margin) out.style.margin = node.props.style.margin;
    for (const child of [].concat(node?.props?.children ?? [])) out.append(draw(child));
    return out;
  };
  window.BdApi = {
    React,
    Webpack: { getStore: (n) => (params.has('broken') ? undefined : stores[n]), getModule: (filter) => modules.find((m) => filter(m)) },
    DOM: {
      addStyle(id, css) { const s = document.createElement('style'); s.id = id; s.textContent = css; document.head.append(s); },
      removeStyle(id) { document.getElementById(id)?.remove(); },
    },
    Data: { load: (n, k) => data[k], save: (n, k, v) => { data[k] = JSON.parse(JSON.stringify(v)); } },
    UI: {
      showConfirmationModal(title, content, options) {
        const back = document.createElement('div'); back.className = 'confirm-back';
        const box = document.createElement('div'); box.className = 'confirm'; box.setAttribute('role', 'alertdialog');
        const h = document.createElement('h2'); h.textContent = title; box.append(h);
        const body = document.createElement('div'); body.className = 'content';
        for (const part of [].concat(content)) body.append(draw(part));
        box.append(body);
        const row = document.createElement('div'); row.className = 'row';
        const no = document.createElement('button'); no.className = 'no'; no.textContent = options.cancelText || 'Cancel';
        const ok = document.createElement('button'); ok.className = 'ok' + (options.danger ? ' danger' : ''); ok.textContent = options.confirmText || 'Okay';
        no.onclick = () => { back.remove(); options.onCancel?.(); };
        ok.onclick = () => { back.remove(); options.onConfirm?.(); };
        row.append(no, ok); box.append(row); back.append(box); document.body.append(back); ok.focus();
      },
      showToast(text, options = {}) {
        const t = document.createElement('div'); t.className = 'toast' + (options.type === 'error' ? ' error' : ''); t.textContent = text;
        document.body.append(t); setTimeout(() => t.remove(), 2500);
      },
    },
  };

  // Pretend pictures: a coloured square with the sticker's name, so no request goes to Discord.
  const Plugin = module.exports;
  const square = (color, text) => 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="28" fill="' + color + '"/>' +
    '<text x="80" y="92" font-family="sans-serif" font-size="30" text-anchor="middle" fill="#17161d">' + text.replace(/[<&>"]/g, '') + '</text></svg>');
  Plugin.Core.stickerUrl = (s) => (s.format === 3 ? null : square(byId.get(s.id)?.color || '#555', s.name.slice(0, 6)));
  Plugin.Core.iconUrl = (server) => (server.icon ? square(colors[Number(server.id) % colors.length], server.name.slice(0, 2)) : null);

  const plugin = new Plugin({ name: 'DiscordDamselStickerManager' });
  plugin.start();
  document.getElementById('panel').append(plugin.getSettingsPanel());
  window.harness = { value, data, log };
  // ?demo: the first server open with three stickers picked, for the README picture.
  if (params.has('demo')) {
    const first = document.querySelector('.ddsm-server');
    first.open = true;
    setTimeout(() => { for (const i of [1, 2, 7]) first.querySelectorAll('.ddsm-sticker')[i].click(); }, 50);
  }
  log('Loaded ' + order.length + ' pretend servers.' + (params.has('empty') ? ' No favorites list yet (?empty).' : '') +
    (params.has('zero') && !params.has('empty') ? ' 0 favorites (?zero).' : '') + (params.has('broken') ? ' Discord not found (?broken).' : ''));
})();
</script>
</body>
</html>
